services:
  postgres:
    image: postgres:16
    container_name: currentsee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: currentsee
      POSTGRES_USER: currentsee_user
      POSTGRES_PASSWORD: currentsee_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: